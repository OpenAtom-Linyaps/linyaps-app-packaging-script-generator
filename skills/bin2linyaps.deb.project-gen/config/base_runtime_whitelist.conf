# 玲瓏 base/runtime 白名單配置
# ============================================
# 此白名單以多份一致副本方式存在（內容完全相同，維護時需同步）：
#   - 全局參考副本：skills/config/base_runtime_whitelist.conf
#   - 每個需要白名單的 skill 在自身目錄下攜帶一份自包含副本：
#     skills/bin2linyaps.<skill>/config/base_runtime_whitelist.conf
# 各 skill 一律以 ${skill_root}/config/base_runtime_whitelist.conf 引用自帶副本
# （skill_root 為該 skill 的目錄），確保 skill 內部可自解析、不依賴目錄外的文件。
# 生成工程時，對應的 skill 副本被同步複製到工程 config/ 目錄。
#
# 格式說明：
#   - 每行一個條目，格式為：<base_id>/<base_version> <runtime_id>/<runtime_version> <描述>
#   - 以 # 開頭的行為注釋
#   - 空行忽略
#   - runtime_id 可為 "-" 表示無需 runtime（純 base 應用）
#
# ⚠️ 重要：白名單驗證是強制性的！
#   - 組合不在白名單中時，將阻止任務執行（包括 skills 初始化生成和實際打包）
#   - 如需使用新組合，請同步更新所有副本
#
# 此白名單用於：
#   1. pak_linyaps.sh 運行時驗證 base/runtime 是否為已知的合規組合（阻止不合規組合）
#   2. SKILL 生成階段驗證 base/runtime 組合（阻止不合規組合）
#   3. validate_base_runtime.sh / validate_pak_script.sh 離線驗證
#   4. LLM 生成時參考可用的 base/runtime 組合
#
# 查找優先級（skill 本地自包含副本優先，全局為參考）：
#   1. CLI 參數 --whitelist 指定的路徑
#   2. 環境變量 LINGLONG_WHITELIST_FILE 指定的路徑
#   3. 工程目錄下的 config/base_runtime_whitelist.conf
#   4. skill 自帶的 config/base_runtime_whitelist.conf（此文件，自包含）⭐
#   5. 全局 skills/config/base_runtime_whitelist.conf（參考副本）
#
# 維護說明：
#   - 新增玲瓏官方發布的 base/runtime 時，請同步更新所有副本（全局 + 各 skill）
#   - 版本號應與玲瓏倉庫實際可用版本一致
#   - 廢棄的組合可保留但標記為 [deprecated]
#   - 修改任一副本後，下次生成工程時會自動同步到工程 config/ 目錄

